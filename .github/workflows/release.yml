name: Release

# Membangun APK dan menerbitkannya ke GitHub Releases saat tag v* di-push,
# misalnya: git tag v0.1.0 && git push origin v0.1.0
#
# Sampai keystore rilis disiapkan (PB19), APK ditandatangani dengan debug key
# milik runner CI yang berbeda di setiap run. Akibatnya APK baru tidak dapat
# dipasang menimpa APK sebelumnya; penguji perlu uninstall terlebih dahulu.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - run: mv build/app/outputs/flutter-apk/app-release.apk agam-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: agam-${{ github.ref_name }}.apk
          generate_release_notes: true
