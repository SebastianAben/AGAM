name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/tiles/requirements-campus.txt

      - run: python3 -m pip install -r tools/tiles/requirements-campus.txt
      - run: python3 -X utf8 -m unittest discover -s tools/tiles -p 'test_*.py' -q

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: agam-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - run: flutter build apk --debug --dart-define=AGAM_INTERNAL_DEMO=true
      - run: python3 tools/tiles/audit_assets.py --apk build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: agam-internal-demo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
